    <style>
        .char-header {
            text-align:center; padding:60px 20px 30px;
        }
        .char-header .char-avatar {
            width:100px; height:100px; border-radius:50%;
            background:linear-gradient(135deg,var(--primary),var(--secondary));
            display:flex; align-items:center; justify-content:center;
            margin:0 auto 16px; font-size:40px; color:#fff;
        }
        .char-header h1 { font-size:clamp(28px,5vw,44px); font-weight:700; }
        .char-header .char-source { color:var(--text-secondary); font-size:16px; }
        .pose-grid {
            display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
            gap:16px; padding:0 0 40px;
        }
        .pose-card {
            background:var(--card); border-radius:14px; overflow:hidden;
            box-shadow:0 2px 8px rgba(0,0,0,0.04); transition:all 0.3s;
            cursor:pointer; aspect-ratio:3/4;
        }
        .pose-card:hover { transform:translateY(-4px); box-shadow:0 8px 24px rgba(0,0,0,0.12); }
        .pose-card .pose-img {
            height:70%; background:var(--bg-alt);
            display:flex; align-items:center; justify-content:center;
            font-size:48px; color:var(--text-secondary);
            overflow:hidden;
        }
        .pose-card .pose-img img {
            width:100%; height:100%; object-fit:cover;
            transition:transform 0.3s;
        }
        .pose-card:hover .pose-img img { transform:scale(1.05); }
        .pose-card .pose-info { padding:12px; text-align:center; }
        .pose-card .pose-info h4 { font-size:14px; margin-bottom:2px; }
        .pose-card .pose-info p { font-size:12px; color:var(--text-secondary); }
        .no-data {
            text-align:center; padding:60px 20px; color:var(--text-secondary);
        }
        .no-data i { font-size:48px; display:block; margin-bottom:16px; opacity:0.3; }
    </style>

            '咒术回战':'✋','鬼灭之刃':'🌊','进击的巨人':'🧱','电锯人':'⛓️','死神':'💀',

    function openLightbox(charName, index, basePath) {
        var img = document.getElementById('lightboxImg');
        var cap = document.getElementById('lightboxCaption');
