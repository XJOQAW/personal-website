<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动作参考 - 一方通行</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=38">
</head>
<body>
    <nav class="nav visible" id="nav">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">一方通行</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">首页</a>
                <a href="index.html#services" class="nav-link">服务</a>
                <a href="portfolio.html" class="nav-link">作品</a>
                <a href="reference.html" class="nav-link active">动作参考</a>
                <a href="index.html#pricing" class="nav-link">价格</a>
                <a href="index.html#contact" class="nav-link">联系</a>
            </div>
            <div class="nav-actions">
                <button class="nav-theme" id="themeBtn"><i class="fas fa-moon"></i></button>
                <div class="auth-section" id="authSection">
                    <button class="nav-login" id="loginBtn" onclick="document.getElementById('loginModal').classList.add('active')">登录</button>
                </div>
                <div class="user-section" id="userSection" style="display:none;">
                    <div class="user-info" id="userInfoBtn" onclick="document.getElementById('accountModal').classList.add('active')">
                        <div class="user-avatar" id="userAvatar">👤</div>
                        <span class="user-name" id="userName">用户</span>
                    </div>
                    <button class="nav-logout" id="logoutBtn" onclick="firebase.auth().signOut()"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
            <button class="nav-hamburger" id="hamburgerBtn"><span></span><span></span><span></span></button>
        </div>
    </nav>
    <div class="mobile-menu" id="mobileMenu">
        <a href="index.html">首页</a>
        <a href="index.html#services">服务</a>
        <a href="portfolio.html">作品</a>
        <a href="reference.html">动作参考</a>
        <a href="index.html#pricing">价格</a>
        <a href="index.html#contact">联系</a>
    </div>

    <main style="padding-top:80px">
        <section class="section">
            <div class="container">
                <div class="section-header">
                    <span class="section-tag">动作参考</span>
                    <h2>搜索角色动作参考</h2>
                    <p>输入角色名称，查找参考图片</p>
                </div>
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="referenceSearch" class="search-input" placeholder="搜索您需要参考的角色">
                </div>
                <div class="search-results" id="searchResults">
                    <p class="account-empty">请输入角色名称开始搜索</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-brand"><h3>一方通行</h3><p>用严谨丈量创作</p></div>
                <div class="footer-links"><h4>快速链接</h4><a href="index.html">首页</a><a href="portfolio.html">作品</a><a href="index.html#contact">联系</a></div>
            </div>
            <div class="footer-bottom"><p>© 2026 一方通行</p></div>
        </div>
    </footer>

    <!-- 登录模态框 -->
    <div class="modal" id="loginModal">
        <div class="modal-box">
            <button class="modal-close" id="loginClose" onclick="document.getElementById('loginModal').classList.remove('active')">&times;</button>
            <h2 id="loginTitle">登录</h2>
            <div class="login-tabs">
                <button class="login-tab active" data-tab="login">登录</button>
                <button class="login-tab" data-tab="register">注册</button>
            </div>
            <form class="login-form" id="loginForm">
                <div class="input-group"><i class="fas fa-user"></i><input type="text" id="loginAccount" placeholder="账号" required></div>
                <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="loginPassword" placeholder="密码" required></div>
                <button type="submit" class="btn btn-primary btn-full">登录</button>
            </form>
            <form class="login-form" id="registerForm" style="display:none">
                <div class="input-group"><i class="fas fa-user"></i><input type="text" id="registerName" placeholder="用户名" required></div>
                <div class="input-group"><i class="fas fa-at"></i><input type="text" id="registerAccount" placeholder="自定义账号" required></div>
                <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="registerPassword" placeholder="密码" required></div>
                <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="registerConfirm" placeholder="确认密码" required></div>
                <button type="submit" class="btn btn-primary btn-full">注册</button>
            </form>
            <div class="login-divider"><span>或者</span></div>
            <button class="btn btn-google" id="googleLoginBtn"><i class="fab fa-google"></i> Google登录</button>
        </div>
    </div>

    <!-- 账号模态框 -->
    <div class="modal" id="accountModal">
        <div class="modal-box account-modal">
            <button class="modal-close" onclick="document.getElementById('accountModal').classList.remove('active')">&times;</button>
            <div class="account-header">
                <div class="account-avatar-wrap">
                    <div class="account-avatar" id="accountAvatar">U</div>
                    <button class="avatar-edit-btn" id="avatarEditBtn"><i class="fas fa-camera"></i></button>
                </div>
                <h3 id="accountName">用户</h3>
                <p id="accountEmail">未登录</p>
            </div>
            <div class="account-tabs">
                <button class="account-tab active" data-tab="profile"><i class="fas fa-user"></i> 资料</button>
                <button class="account-tab" data-tab="likes"><i class="fas fa-heart"></i> 点赞</button>
                <button class="account-tab" data-tab="orders"><i class="fas fa-list"></i> 记录</button>
                <button class="account-tab" data-tab="settings"><i class="fas fa-cog"></i> 设置</button>
            </div>
            <div class="account-panel active" id="panel-profile">
                <form id="profileForm" class="account-form">
                    <div class="form-group"><label>昵称</label><input type="text" id="profileName"></div>
                    <div class="form-group"><label>简介</label><textarea id="profileBio" rows="3"></textarea></div>
                    <div class="form-group"><label>头像预设</label>
                        <div class="avatar-presets">
                            <div class="avatar-option" data-avatar="👩">👩</div><div class="avatar-option" data-avatar="👨">👨</div>
                            <div class="avatar-option" data-avatar="🧑">🧑</div><div class="avatar-option" data-avatar="🎀">🎀</div>
                            <div class="avatar-option" data-avatar="🌸">🌸</div><div class="avatar-option" data-avatar="⭐">⭐</div>
                            <div class="avatar-option" data-avatar="🎭">🎭</div><div class="avatar-option" data-avatar="📸">📸</div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">保存修改</button>
                </form>
            </div>
            <div class="account-panel" id="panel-likes"><div class="account-list" id="likesList"><p class="account-empty">暂无点赞</p></div></div>
            <div class="account-panel" id="panel-orders"><div class="account-list" id="ordersList"><p class="account-empty">暂无记录</p></div></div>
            <div class="account-panel" id="panel-settings">
                <div class="settings-item"><span>深色模式</span><button class="settings-toggle" id="settingsDarkMode"><i class="fas fa-moon"></i></button></div>
                <div class="settings-item"><span>退出登录</span><button class="btn btn-outline" id="settingsLogout" style="padding:6px 16px;font-size:13px;">退出</button></div>
            </div>
        </div>
    </div>
    <input type="file" id="avatarUpload" accept="image/*" style="display:none">

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="script.js?v=38"></script>
</body>
</html>
