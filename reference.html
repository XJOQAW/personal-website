    document.addEventListener('DOMContentLoaded', function() {
        // 已上传参考图的角色列表（游戏名|角色名），避免移动端加载不存在的图片
        // 已上传参考图的角色列表 - 自动检测 thumb.png
        var knownThumbs = (function() {
            var wuwa = ['莫宁','洛可可','夏空','坎特蕾拉','露帕','尤诺','赞妮','卡卡罗','菲比','布兰特','艾弥斯','奥古斯塔','绯雪','弗洛洛','卡提西亚','琳奈','陆.赫斯','千xiao','西格莉卡e','安可','白芷','卜灵','椿','长离','炽霞','丹瑾','灯灯','嘉贝莉娜','鉴心','今汐','忌炎','凌阳','莫特菲','秋水','仇远','散华','守岸人','桃祈','维里奈','相里要','秧秧','吟霖','釉瑚','渊武','折枝','珂莱塔'];
            var genshin = ['胡桃','雷电将军','钟离','甘雨','芙宁娜','神里绫华','那维莱特','纳西妲','刻晴','八重神子','温迪','优菈','宵宫','夜兰','达达利亚','琴','七七','可莉','万叶','珊瑚宫心海','荒泷一斗','赛诺','艾尔海森','迪希雅','提纳里','妮露','阿贝多','莫娜','申鹤','白术','迪卢克','魈','凝光','菲谢尔','芭芭拉','香菱','行秋','重云','砂糖','北斗','诺艾尔','迪奥娜','早柚','九条裟罗','五郎','云堇','久岐忍','菲米尼','琳妮特','夏洛蒂','嘉明','夏沃蕾','千织','绮良良','卡维','莱依拉','瑶瑶','米卡','多莉','柯莱','辛焱','烟绯','坎蒂丝','艾梅莉埃','基尼奇','玛拉妮','希诺宁','恰斯卡','茜特菈莉','林尼','娜维娅','阿蕾奇诺','克洛琳德','希格雯','闲云','瓦雷莎','欧洛伦','伊安珊','蓝砚','丝柯克','丽莎','伊法','伊涅芙','凯亚','卡齐娜','叶洛亚','哥伦比娅·希珀塞莱尼娅','奈芙尔','安柏','尼克','杜林','法尔伽','爱可菲','爱诺','玛薇卡','神里绫人','罗莎莉亚','莉奈娅','莱欧斯利','菈乌玛','菲林斯','赛索斯','雅珂达','雷泽'];
            var list = ['蔚蓝档案|一之濑明日奈', '碧蓝航线|恶毒白兔'];
            for (var i = 0; i < wuwa.length; i++) list.push('鸣潮|' + wuwa[i]);
            for (var j = 0; j < genshin.length; j++) list.push('原神|' + genshin[j]);
            return list;
        })();

        // 生成标签
        function makeTags(containerId, items, isAnime) {
            var el = document.getElementById(containerId);
            if (!el) return;
            items.forEach(function(item, i) {
                var btn = document.createElement('button');
                btn.className = isAnime ? 'ref-cat' : 'ref-tag';
                btn.setAttribute(isAnime ? 'data-cat' : 'data-game', typeof item === 'string' ? item : item.name);
                btn.textContent = typeof item === 'string' ? item : item.name;
                el.appendChild(btn);
            });
        }
        makeTags('tagsEryou', refData['二游']);
        makeTags('tagsDanji', refData['单机']);
        makeTags('tagsWangyou', refData['网游']);
        makeTags('tagsShouyou', refData['手游']);
        var animeCats = Object.keys(refData['番剧']);
        makeTags('animeCats', animeCats, true);

        // 默认显示全部角色
        var allGames = [];
        Object.keys(refData).forEach(function(k) {
            if (k === '番剧') {
                Object.keys(refData[k]).forEach(function(cat) {
                    refData[k][cat].forEach(function(g) { allGames.push(g); });
                });
            } else {
                refData[k].forEach(function(g) { allGames.push(g); });
            }
        });
        var section = document.getElementById('charsSection');
        allGames.forEach(function(game) { appendCharGroup(game, section); });

        function appendCharGroup(game, container) {
            var group = document.createElement('div');
            group.className = 'char-group';
            group.setAttribute('data-game', game.name);
            var hotChars = game.chars;
            var alphaChars = game.chars.slice().sort(function(a, b) {
                return a.localeCompare(b, 'zh-CN');
            });
            var html = '<h3 class="char-group-title">' + game.name + '</h3>';
            html += '<div class="char-sort-tabs"><button class="char-sort-tab active" data-sort="hot">热门排行</button><button class="char-sort-tab" data-sort="alpha">名字排序</button></div>';
            html += '<div class="char-grid char-grid-hot">';
            hotChars.forEach(function(c, i) {
                var gameKey = game.name.replace(/[:：]/g, '_') + '|' + c;
                var thumb = 'images/characters/' + game.name.replace(/[:：]/g, '_') + '/' + c + '/thumb.png';
                if (knownThumbs.indexOf(gameKey) !== -1) {
                    html += '<a href="character.html?name=' + encodeURIComponent(c) + '&game=' + encodeURIComponent(game.name) + '" class="char-card-link"><div class="char-card"><div class="char-img"><img src="' + thumb + '" alt="' + c + '" onerror="this.style.display=\'none\'" loading="eager"><span class="char-rank">NO.' + (i+1) + '</span></div><p class="char-name">' + c + '</p></div></a>';
                } else {
                    html += '<a href="character.html?name=' + encodeURIComponent(c) + '&game=' + encodeURIComponent(game.name) + '" class="char-card-link"><div class="char-card"><div class="char-img"><span class="char-rank">NO.' + (i+1) + '</span></div><p class="char-name">' + c + '</p></div></a>';
                }
            });
            html += '</div>';
            html += '<div class="char-grid char-grid-alpha" style="display:none;">';
            alphaChars.forEach(function(c, i) {
                var gameKey = game.name.replace(/[:：]/g, '_') + '|' + c;
                var thumb = 'images/characters/' + game.name.replace(/[:：]/g, '_') + '/' + c + '/thumb.png';
                if (knownThumbs.indexOf(gameKey) !== -1) {
                    html += '<a href="character.html?name=' + encodeURIComponent(c) + '&game=' + encodeURIComponent(game.name) + '" class="char-card-link"><div class="char-card"><div class="char-img"><img src="' + thumb + '" alt="' + c + '" onerror="this.style.display=\'none\'" loading="eager"><span class="char-rank alpha">' + c.charAt(0) + '</span></div><p class="char-name">' + c + '</p></div></a>';
                } else {
                    html += '<a href="character.html?name=' + encodeURIComponent(c) + '&game=' + encodeURIComponent(game.name) + '" class="char-card-link"><div class="char-card"><div class="char-img"><span class="char-rank alpha">' + c.charAt(0) + '</span></div><p class="char-name">' + c + '</p></div></a>';
                }
            });
            html += '</div>';
            group.innerHTML = html;
            // 排序切换
            group.querySelector('.char-sort-tabs').addEventListener('click', function(e) {
                if (e.target.classList.contains('char-sort-tab')) {
                    var tabs = this.querySelectorAll('.char-sort-tab');
                    tabs.forEach(function(t) { t.classList.remove('active'); });
                    e.target.classList.add('active');
                    var sort = e.target.getAttribute('data-sort');
                    group.querySelector('.char-grid-hot').style.display = sort === 'hot' ? 'grid' : 'none';
                    group.querySelector('.char-grid-alpha').style.display = sort === 'alpha' ? 'grid' : 'none';
                }
            });
            container.appendChild(group);
        }

        // 标签点击 - 只显示点击的那个
        document.addEventListener('click', function(e) {
            var target = e.target;
            if (target.classList.contains('ref-tag') || target.classList.contains('ref-cat')) {
                var name = target.textContent.trim();
                document.getElementById('referenceSearch').value = name;
                // 隐藏全部
                document.querySelectorAll('.char-group').forEach(function(g) { g.style.display = 'none'; });
                // 只显示匹配的
                var shown = false;
                document.querySelectorAll('.char-group').forEach(function(g) {
                    var gName = g.getAttribute('data-game');
                    if (gName && (gName === name || name.indexOf(gName) !== -1 || gName.indexOf(name) !== -1)) {
                        g.style.display = 'block';
                        shown = true;
                    }
                });
                if (!shown) {
                    // 没找到，显示全部
                    document.querySelectorAll('.char-group').forEach(function(g) { g.style.display = 'block'; });
                }
            }
        });

        // 番剧分类
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('ref-cat')) {
                var cat = e.target.textContent.trim();
                var panel = document.getElementById('animePanel');
                var subTags = document.getElementById('animeSubTags');
                panel.style.display = 'block';
                subTags.innerHTML = '';
                var animes = refData['番剧'][cat];
                if (animes) {
                    animes.forEach(function(a) {
                        var btn = document.createElement('button');
                        btn.className = 'ref-tag';
                        btn.setAttribute('data-game', a.name);
                        btn.textContent = a.name;
                        subTags.appendChild(btn);
                    });
                }
            }
        });

        // 搜索建议
        var searchInput = document.getElementById('referenceSearch');
        var suggestBox = document.getElementById('searchSuggestions');
        var allCharNames = [];
        Object.keys(refData).forEach(function(k) {
            if (k === '番剧') {
                Object.keys(refData[k]).forEach(function(cat) {
                    refData[k][cat].forEach(function(g) { g.chars.forEach(function(c) { allCharNames.push(c); }); });
                });
            } else {
                refData[k].forEach(function(g) { g.chars.forEach(function(c) { allCharNames.push(c); }); });
            }
        });
        allCharNames = [...new Set(allCharNames)];
        if (searchInput && suggestBox) {
            searchInput.addEventListener('input', function() {
                var val = this.value.trim().toLowerCase();
                suggestBox.innerHTML = '';
                if (!val) { suggestBox.classList.remove('active'); return; }
                var matches = allCharNames.filter(function(n) { return n.toLowerCase().includes(val); });
                if (!matches.length) { suggestBox.classList.remove('active'); return; }
                matches.slice(0, 8).forEach(function(n) {
                    var item = document.createElement('div');
                    item.className = 'search-suggest-item';
                    item.textContent = n;
                    item.addEventListener('click', function() { searchInput.value = n; suggestBox.classList.remove('active'); });
                    suggestBox.appendChild(item);
                });
                suggestBox.classList.add('active');
            });
            document.addEventListener('click', function(e) { if (!searchInput.contains(e.target) && !suggestBox.contains(e.target)) suggestBox.classList.remove('active'); });
        }

        // ===== 许愿池（Worker同步） =====
        var WISH_KEY = 'siteWishes', WISH_API = 'https://yifang-comments.ytongxing00.workers.dev/api/wishes';
        function getWishes() {
            try { return JSON.parse(localStorage.getItem(WISH_KEY) || '[]'); } catch(e) { return []; }
        }
        function saveWishes(wishes) {
            localStorage.setItem(WISH_KEY, JSON.stringify(wishes));
        }
        function workerWishPost(data, cb) {
            fetch(WISH_API, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.json()}).then(cb).catch(function(){});
        }
        function workerWishDelete(id, authorId, cb) {
            fetch(WISH_API + '/' + id + '?authorId=' + encodeURIComponent(authorId), {method:'DELETE'}).then(function(r){return r.json()}).then(cb).catch(function(){});
        }
        function workerWishVote(id, delta) {
            fetch(WISH_API + '/' + id + '/vote', {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({delta:delta})}).catch(function(){});
        }
        function getCurrentUserForWish() {
            if (typeof getCurrentUserId !== 'undefined') return getCurrentUserId();
            return localStorage.getItem('currentUser') || null;
        }
        function renderWishes() {
            var list = document.getElementById('wishList');
            var wishes = getWishes();
            var currentId = getCurrentUserForWish();
            wishes.sort(function(a,b){ return b.votes - a.votes; });
            list.innerHTML = wishes.map(function(w, i) {
                var delBtn = (currentId && w.authorId === currentId) ? '<button class="wish-del-btn" data-idx="' + i + '"><i class="fas fa-times"></i></button>' : '';
                var avatarTxt = (typeof getCurrentUserId !== 'undefined' && getCurrentUserId()) ? (w.authorId ? w.authorId.slice(0,2).toUpperCase() : '?') : '?';
                return '<div class="wish-item"><span class="wish-avatar">' + avatarTxt + '</span><div class="wish-content"><strong>' + escHTML(w.name) + '</strong><span>' + w.time + '</span></div><button class="wish-vote" data-idx="' + i + '">👍 ' + (w.votes || 0) + '</button>' + delBtn + '</div>';
            }).join('') || '<p style="text-align:center;color:var(--text-secondary);font-size:12px;padding:20px 0;">还没有人许愿，快来第一个！</p>';
            // 投票
            document.querySelectorAll('.wish-vote').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var idx = parseInt(this.getAttribute('data-idx'));
                    var wishes = getWishes();
                    wishes.sort(function(a,b){ return b.votes - a.votes; });
                    if (wishes[idx]) { wishes[idx].votes = (wishes[idx].votes || 0) + 1; workerWishVote(wishes[idx].id, 1); }
                    var all = getWishes();
                    for (var j = 0; j < all.length; j++) {
                        if (all[j].name === wishes[idx].name && all[j].time === wishes[idx].time && all[j].authorId === wishes[idx].authorId) {
                            all[j].votes = wishes[idx].votes;
                            break;
                        }
                    }
                    saveWishes(all);
                    renderWishes();
                });
            });
            // 删除
            document.querySelectorAll('.wish-del-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var idx = parseInt(this.getAttribute('data-idx'));
                    var wishes = getWishes();
                    wishes.sort(function(a,b){ return b.votes - a.votes; });
                    if (confirm('确定要删除这条许愿吗？')) {
                        wishes.splice(idx, 1);
                        saveWishes(wishes);
                        renderWishes();
                    }
                });
            });
        }
        function escHTML(s) {
            var d = document.createElement('div'); d.textContent = s; return d.innerHTML;
        }
        // 初始化：从 Gist 加载
        fetch(WISH_API).then(function(r){return r.json()}).then(function(remote){if(remote&&remote.length>0)saveWishes(remote);renderWishes()}).catch(function(){renderWishes()});
        document.getElementById('wishSubmit').addEventListener('click', function() {
            var input = document.getElementById('wishInput');
            var name = input.value.trim();
            if (!name) return;
            var uid = getCurrentUserForWish();
            var data = { name: name, time: new Date().toISOString().split('T')[0], votes: 0, authorId: uid };
            workerWishPost(data, function(r) {
                if (r && r.id) {
                    var wishes = getWishes();
                    wishes.push(r);
                    saveWishes(wishes);
                    input.value = '';
                    renderWishes();
                }
            });
        });
        document.getElementById('wishInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('wishSubmit').click();
        });
        document.getElementById('wishPoolHeader').addEventListener('click', function() {
            document.getElementById('wishPool').classList.toggle('collapsed');
        });
    });
    </script>
