<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 一方通行</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/admin.css">
</head>
<body>
    <!-- 登录页 -->
    <div class="login-page" id="loginPage">
        <div class="login-card">
            <div class="login-logo">🛡️</div>
            <h2>管理后台</h2>
            <p>一方通行 - 摄影工作室</p>
            <form id="loginForm">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="adminAccount" placeholder="管理员账号" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="adminPassword" placeholder="密码" required>
                </div>
                <button type="submit" class="btn-login">登录</button>
            </form>
        </div>
    </div>

    <!-- 后台主体 -->
    <div class="admin-layout" id="adminLayout" style="display:none;">
        <!-- 左侧导航 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">🛡️</div>
                <h3>管理后台</h3>
                <p>一方通行</p>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="dashboard"><i class="fas fa-chart-pie"></i> 仪表盘</a>
                <a href="#" class="nav-item" data-page="users"><i class="fas fa-users"></i> 用户管理</a>
                <a href="#" class="nav-item" data-page="reviews"><i class="fas fa-star"></i> 评论管理</a>
                <a href="#" class="nav-item" data-page="rescues"><i class="fas fa-camera"></i> 废片救援</a>
                <a href="#" class="nav-item" data-page="wishes"><i class="fas fa-magic"></i> 许愿池</a>
                <a href="#" class="nav-item" data-page="submissions"><i class="fas fa-paper-plane"></i> 共创投稿</a>
                <a href="#" class="nav-item" data-page="portfolio"><i class="fas fa-images"></i> 作品集</a>
                <a href="#" class="nav-item" data-page="orders"><i class="fas fa-shopping-bag"></i> 订单管理</a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> 退出登录</a>
            </div>
        </aside>

        <!-- 右侧内容 -->
        <main class="main-content">
            <!-- 仪表盘 -->
            <div class="page active" id="page-dashboard">
                <h2>仪表盘</h2>
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-eye"></i></div><div class="stat-info"><h3 id="statTotalViews">0</h3><p>总访问量</p></div></div>
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-user"></i></div><div class="stat-info"><h3 id="statTodayViews">0</h3><p>今日访客</p></div></div>
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-info"><h3 id="statUsers">0</h3><p>注册用户</p></div></div>
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-star"></i></div><div class="stat-info"><h3 id="statReviews">0</h3><p>评论总数</p></div></div>
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-camera"></i></div><div class="stat-info"><h3 id="statRescues">0</h3><p>救援投稿</p></div></div>
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-magic"></i></div><div class="stat-info"><h3 id="statWishes">0</h3><p>许愿池</p></div></div>
                </div>
                <div class="charts-grid">
                    <div class="chart-card"><h3>近7天访问趋势</h3><canvas id="trendChart" height="200"></canvas></div>
                    <div class="chart-card"><h3>热门页面 TOP5</h3><div id="hotPages"></div></div>
                </div>
            </div>

            <!-- 用户管理 -->
            <div class="page" id="page-users">
                <h2>用户管理</h2>
                <div class="toolbar"><input type="text" id="userSearch" placeholder="搜索用户名/账号..." class="search-input"></div>
                <div class="table-wrap"><table class="data-table"><thead><tr><th>账号</th><th>用户名</th><th>手机号</th><th>状态</th><th>操作</th></tr></thead><tbody id="usersBody"></tbody></table></div>
            </div>

            <!-- 评论管理 -->
            <div class="page" id="page-reviews">
                <h2>评论管理</h2>
                <div class="toolbar"><input type="text" id="reviewSearch" placeholder="搜索评论内容..." class="search-input"></div>
                <div class="table-wrap"><table class="data-table"><thead><tr><th>用户</th><th>评分</th><th>内容</th><th>时间</th><th>回复数</th><th>操作</th></tr></thead><tbody id="reviewsBody"></tbody></table></div>
            </div>

            <!-- 废片救援 -->
            <div class="page" id="page-rescues">
                <h2>废片救援</h2>
                <div class="table-wrap"><table class="data-table"><thead><tr><th>用户</th><th>CN</th><th>描述</th><th>状态</th><th>操作</th></tr></thead><tbody id="rescuesBody"></tbody></table></div>
            </div>

            <!-- 许愿池 -->
            <div class="page" id="page-wishes">
                <h2>许愿池</h2>
                <div class="table-wrap"><table class="data-table"><thead><tr><th>用户</th><th>内容</th><th>投票数</th><th>时间</th><th>操作</th></tr></thead><tbody id="wishesBody"></tbody></table></div>
            </div>

            <!-- 共创投稿 -->
            <div class="page" id="page-submissions">
                <h2>共创投稿</h2>
                <div class="table-wrap"><table class="data-table"><thead><tr><th>昵称</th><th>抖音</th><th>联系方式</th><th>作品</th><th>时间</th><th>操作</th></tr></thead><tbody id="submissionsBody"></tbody></table></div>
            </div>

            <!-- 作品集 -->
            <div class="page" id="page-portfolio">
                <h2>作品集管理</h2>
                <div class="portfolio-categories" id="portfolioCats"></div>
                <div class="portfolio-grid" id="portfolioGrid"></div>
            </div>

            <!-- 订单管理 -->
            <div class="page" id="page-orders">
                <h2>订单管理</h2>
                <div class="table-wrap"><table class="data-table"><thead><tr><th>用户</th><th>套餐</th><th>金额</th><th>状态</th><th>时间</th><th>操作</th></tr></thead><tbody id="ordersBody"></tbody></table></div>
            </div>
        </main>
    </div>

    <script src="/admin.js"></script>
</body>
</html>
