<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><link rel="preconnect" href="https://cdnjs.cloudflare.com"><link rel="preconnect" href="https://cdn.jsdelivr.net"><title>场景拍摄 - 一方通行</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="style.css?v=37"><style>
.pw{max-width:1000px;margin:0 auto;padding:40px 20px}.pw h1{text-align:center;margin-bottom:8px}.pw .sub{text-align:center;color:var(--text-secondary);font-size:13px;margin-bottom:30px}.pw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.pw-box{position:relative;width:100%;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--bg-alt)}.pw-box img{width:100%;height:100%;object-fit:cover;object-position:center 20%;cursor:pointer}.pw-box.placeholder{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--bg-alt),var(--card));color:var(--text-secondary);font-size:14px;cursor:default}.pw-box-label{position:absolute;bottom:0;left:0;right:0;padding:8px 14px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:12px;pointer-events:none}.lb-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);z-index:9999;display:none;align-items:center;justify-content:center;cursor:zoom-out}.lb-overlay.active{display:flex}.lb-img{max-width:90vw;max-height:90vh;object-fit:contain;user-select:none;-webkit-user-drag:none}.lb-close{position:absolute;top:20px;right:30px;color:#fff;font-size:32px;cursor:pointer}body.no-scroll{overflow:hidden}
@media(max-width:768px){.pw-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.pw-grid{grid-template-columns:1fr}}
</style></head><body>

<!-- 登录弹窗 -->
<div class="modal" id="loginModal"><div class="modal-box"><button class="modal-close" onclick="this.parentElement.parentElement.classList.remove('active')">&times;</button><h2 id="loginTitle">登录</h2><div class="login-tabs"><button class="login-tab active" data-tab="login">登录</button><button class="login-tab" data-tab="register">注册</button></div><form class="login-form" id="loginForm"><div class="input-group"><i class="fas fa-user"></i><input type="text" id="loginAccount" placeholder="账号" required></div><div class="input-group"><i class="fas fa-lock"></i><input type="password" id="loginPassword" placeholder="密码" required></div><button type="submit" class="btn btn-primary btn-full">登录</button></form><form class="login-form" id="registerForm" style="display:none" onsubmit="doRegister(event)"><div class="input-group"><i class="fas fa-user"></i><input type="text" id="registerName" placeholder="用户名" required></div><div class="input-group"><i class="fas fa-at"></i><input type="text" id="registerAccount" placeholder="自定义账号" required></div><div class="input-group"><i class="fas fa-lock"></i><input type="password" id="registerPassword" placeholder="密码" required></div><div class="input-group"><i class="fas fa-lock"></i><input type="password" id="registerConfirm" placeholder="确认密码" required></div><button type="submit" class="btn btn-primary btn-full">注册</button></form></div></div>

<script src="app.js?v=1"></script><script src="script.js?v=44"></script>
<script>function openLightbox(src){document.getElementById('lbImg').src=src;document.getElementById('lbOverlay').classList.add('active');document.body.classList.add('no-scroll')}function closeLightbox(){document.getElementById('lbOverlay').classList.remove('active');document.body.classList.remove('no-scroll')}document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLightbox()});document.addEventListener('contextmenu',function(e){if(e.target.closest('.lb-overlay.active,.pw-box img'))e.preventDefault()})</script></body></html>
